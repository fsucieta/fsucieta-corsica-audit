name: FSUCIETÀ OSINT Suite CI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-osint-suite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Run DVF Cadastre Analyzer Test
      run: |
        python osint_tools/dvf_cadastre_analyzer.py --commune "Ajaccio" --year 2025
        
    - name: Run INPI Beneficial Ownership Tracker Test
      run: |
        python osint_tools/inpi_rbe_corporate_network_tracker.py --siren 884123456
        
    - name: Run Copernicus ESA Satellite Monitor Test
      run: |
        python osint_tools/copernicus_esa_satellite_monitor.py --lat 41.92 --lon 8.73
        
    - name: Run Bufitonu.fr OSINT Engine Test
      run: |
        python osint_tools/bufitonu_platform_connector.py --type dvf
