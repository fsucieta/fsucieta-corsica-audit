                if (filter === 'speculation' && parseFloat(g.sec_rate) < 45) show = false;
                if (filter === 'water' && parseFloat(g.water_leak) < 35) show = false;
                if (filter === 'mines' && !g.axes.some(a => a.includes('Mines') || a.includes('Militaires'))) show = false;

                if (show) {
                    const marker = L.circleMarker([g.lat, g.lng], {
                        radius: filter === 'all' ? 10 : 13,
                        fillColor: g.color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(map);

                    marker.on('click', () => updateInspector(g));
                    marker.bindTooltip(`<b>${g.name}</b><br>${g.type}`, { permanent: false, direction: 'top' });
                    mapMarkers.push(marker);
                }
            });
        }

            titleDiv.innerText = item.name + ' (' + item.type + ')';

                      `Monsieur le Maire,\n\n` +

                      `Considérant que cette décision tacite prive la commune d'une étude d'impact préalable rigoureuse en zone littorale sensible et au vu des données d'audit CASA DI CRISTALE 2.0 (Référence FSUCIETA-AUDIT-AXE-22),\n` +
                      `Je vous demande formellement par la présente d'user de votre pouvoir de retrait pour motif d'illégalité dans le délai réglementaire de 3 mois.\n\n` +

                txt = `À l'attention de Monsieur le Maire de ${commune}\n` +

                      `Monsieur le Maire,\n\n` +
                      `Je sollicite par la présente la communication de l'arrêté de changement de destination accordé au titre de l'article L. 151-11 du Code de l'Urbanisme concernant la reconversion du bâtiment pastoral/bergerie situé sur la commune de ${commune}.\n\n` +
                      `Afin de vérifier le maintien de la vocation pastorale et d'éviter tout détournement à des fins spéculatives privées, je demande formellement l'accès aux pièces justificatives et à l'avis conforme émis par la commission départementale (CDPENAF).\n\n` +
                      `Veuillez agréer, Monsieur le Maire, mes salutations distinguées.`;

                txt = `À Monsieur le Président de la CADA (Commission d'Accès aux Documents Administratifs)\n` +

        // 3. Rendu dynamique des fiches
        function renderFiches(data) {
            const grid = document.getElementById('fichesGrid');
            grid.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'fiche-card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <div class="fiche-number">Fiche Audit #${item.id < 10 ? '0' + item.id : item.id}</div>
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                    <span class="tool-tag">${item.tool}</span>
                `;
                grid.appendChild(card);
            });
        }

                                                                                                                                                                                                                // 4. Modal d'affichage INTÉGRAL DU DOSSIER D'INVESTIGATION (ARTICLE COMPLET HIGH CONTRAST)

                        🔗 <span style="color: #007791;">${s.name}</span> <span style="font-size: 0.82rem; color: #475569;">[Consulter la Preuve Officielle ↗]</span>

                </li>`;

                    <div>

                <!-- Métadonnées Journalistiques -->

                </div>

                <!-- Bouton Téléchargement Dossier Brut Markdown -->
                <div style="padding-top: 1.5rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.2rem;">
                    <span style="font-size: 0.95rem; color: #b8860b; font-weight: 800;">CASA DI CRISTALE 2.0 — Investigation Libre & Souveraine</span>
                    <a href="${dossierFileName}" target="_blank" style="background: linear-gradient(135deg, #b8860b 0%, #d4af37 100%); color: #ffffff; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: 800; font-size: 0.92rem; box-shadow: 0 4px 15px rgba(184,134,11,0.3);">📄 Consulter le Fichier Source Markdown Brut (.MD) ↗</a>
                </div>

            modal.style.display = 'flex';
        }

        function closeModal(event) {
            if (event.target.id === 'ficheModal') {
                document.getElementById('ficheModal').style.display = 'none';
            }
        }

        function closeModalForce() {
            document.getElementById('ficheModal').style.display = 'none';
        }

        // 5. Filtrage dynamique
        function filterFiches() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fichesData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query) ||
                item.details.toLowerCase().includes(query) ||
                item.tool.toLowerCase().includes(query)
            );
            renderFiches(filtered);
        }

        // Initialisation
        renderFiches(fichesData);
    </script>
